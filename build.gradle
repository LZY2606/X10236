plugins {
    id 'java'
}
allprojects {
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java'
    group = 'neurospike'
    version = '1.0.0'
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
