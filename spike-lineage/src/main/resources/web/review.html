<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>脉冲簇谱审阅 · 棘波 / 漂移 / 裁定谱系</title>
<style>
  body { font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; margin: 0; background:#f7f8fa; color:#111; }
  header { background:#111827; color:#fff; padding:10px 16px; }
  header h1 { margin:0; font-size:15px; }
  header .basis { color:#9ca3af; font-size:11px; margin-top:2px; }
  .layout { display:grid; grid-template-columns: 360px 1fr 360px; gap:10px; padding:10px; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:10px; margin-bottom:10px; }
  .card h2 { font-size:12px; margin:0 0 8px; color:#374151; text-transform:uppercase; letter-spacing:.04em; }
  table { border-collapse:collapse; width:100%; font-size:11px; }
  th,td { border-bottom:1px solid #f0f0f0; padding:2px 4px; text-align:left; white-space:nowrap; }
  tr.evt { cursor:pointer; }
  tr.evt.sel { background:#fef3c7; }
  tr.invalid { color:#b91c1c; }
  button { font-size:12px; padding:3px 8px; border:1px solid #d1d5db; background:#fff; border-radius:5px; cursor:pointer; margin:2px 2px 2px 0; }
  button.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
  button.danger { background:#dc2626; color:#fff; border-color:#dc2626; }
  .panes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pane { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:6px; overflow:auto; }
  .pane.wide { grid-column: 1 / 3; }
  .tag { display:inline-block; padding:0 6px; border-radius:10px; font-size:10px; margin-right:4px; }
  .tag.OK { background:#dcfce7; color:#166534; }
  .tag.EVIDENCE { background:#fef9c3; color:#854d0e; }
  .tag.LOCAL_FAILURE { background:#fee2e2; color:#991b1b; }
  .tag.CONFLICT { background:#fecaca; color:#7f1d1d; }
  .muted { color:#6b7280; font-size:11px; }
  #downstream { background:#fffbeb; border:1px solid #fcd34d; border-radius:6px; padding:6px; display:none; }
  .hist { cursor:pointer; }
  .hist:hover { text-decoration:underline; }
  svg { max-width:100%; height:auto; }
  input { font-size:12px; padding:2px 4px; width:70px; }
</style>
</head>
<body>
<header>
  <h1>脉冲簇谱：神经棘波候选、漂移簇与人工裁定谱系</h1>
  <div class="basis" id="basis">加载中…</div>
</header>
<div class="layout">
  <div>
    <div class="card">
      <h2>参数版本 / 决定</h2>
      <div id="params" class="muted"></div>
      <div style="margin-top:6px">
        标签集：
        <button data-ls="ls-v1">ls-v1</button>
        <button data-ls="ls-v2">ls-v2 重编号</button>
        <button data-ls="ls-v3">ls-v3 拆分</button>
      </div>
      <div>阈值版本：
        <button data-thr="1">th-v1 (-45uV)</button>
        <button data-thr="2">th-v2 (-50uV)</button>
      </div>
      <div>时间窗(秒, 半开)：
        <input id="winS" value="14"/> <input id="winE" value="22"/>
        <button id="winApply">应用</button>
        <button id="winReset">全时段</button>
      </div>
      <div>源数据局部修订：
        <button id="patchE062">e062 幅度 69→92 uV</button>
      </div>
      <div style="margin-top:6px">
        <a href="/api/export"><button class="primary">导出项目 .spkzip</button></a>
      </div>
    </div>
    <div class="card">
      <h2>检测事件（原始表示保留）</h2>
      <div style="max-height:340px; overflow:auto"><table id="evtTable"></table></div>
    </div>
    <div class="card">
      <h2>裁定历史（点击回到旧事件）</h2>
      <div id="history"></div>
    </div>
  </div>

  <div class="panes">
    <div class="pane wide" id="paneProbe"></div>
    <div class="pane" id="paneWave"><div class="muted">点选左侧事件查看波形</div></div>
    <div class="pane" id="paneProj"></div>
    <div class="pane" id="paneAC"></div>
    <div class="pane" id="paneRate"></div>
    <div class="pane wide" id="paneDrift"></div>
  </div>

  <div>
    <div class="card">
      <h2>派生证据 / 结论（稳定身份）</h2>
      <div id="nodes" style="max-height:380px; overflow:auto"></div>
    </div>
    <div class="card">
      <h2>裁定后受影响下游记录</h2>
      <div id="downstream"></div>
    </div>
    <div class="card">
      <h2>谱系边（合并/拆分/重编号）</h2>
      <div id="lineage" style="max-height:180px; overflow:auto"></div>
    </div>
  </div>
</div>
<script src="/web/app.js"></script>
</body>
</html>
